<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Kiosk</title>
  <meta name="description" content="Kiosk display for tablets." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kiosk" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="display">
  <iframe id="frame" title="Kiosk content" allow="autoplay; fullscreen; camera; microphone; geolocation; clipboard-read; clipboard-write"></iframe>

  <main id="empty" class="center" hidden>
    <h1>No website set</h1>
    <p class="muted">Go to admin and enter the address you want to show.</p>
    <a href="admin.html" class="btn btn-primary" id="open-admin">Open admin</a>
  </main>

  <div id="offline" class="center notice" hidden>
    <p><strong>No internet connection</strong></p>
    <p class="muted">The page will reload when the connection is back.</p>
  </div>

  <div id="hotspot" class="hotspot" aria-hidden="true"><span class="hold-bar"></span></div>

  <script src="common.js"></script>
  <script src="display.js"></script>
</body>
</html>
